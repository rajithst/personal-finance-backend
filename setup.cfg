[coverage:run]
source = transactions, investments, workflow
branch = True
omit = */migrations/*, */tests/*, */__init__.py, */validators/*, */serializers/*, */models.py, */admin.py, */apps.py, */urls.py, */forms.py, */signals.py, */wsgi.py, */settings.py, */asgi.py, */__pycache__/*
[coverage:report]
show_missing = True
skip_covered = True
[coverage:html]
directory = coverage_html_report