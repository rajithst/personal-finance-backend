cron:
- description: "daily stock value update/insert"
  url: /investments/stocks/cron/value/daily
  schedule: every 6 hours from 00:30 to 23:59
  timezone: Asia/Tokyo
  target: coincraftservice

- description: "daily forex value update/insert"
  url: /investments/forex/cron/value/daily
  schedule: every 6 hours from 00:30 to 23:59
  timezone: Asia/Tokyo
  target: coincraftservice

- description: "daily dividend income calculate update/insert"
  url: /investments/dividends/cron/income/daily/
  schedule: everyday 07:00
  timezone: Asia/Tokyo
  target: coincraftservice

- description: "daily dividend payment update/insert"
  url: /investments/dividends/cron/payments/daily/
  schedule: everyday 07:00
  timezone: Asia/Tokyo
  target: coincraftservice
