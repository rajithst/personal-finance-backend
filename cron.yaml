cron:
# stock cron
- description: "daily stock market value update/insert"
  url: /investments/cron/stocks/market-value/
  schedule: every 6 hours from 00:10 to 23:59
  timezone: Asia/Tokyo
  target: coincraftservice
  retry_parameters:
    job_retry_limit: 0

- description: "stock split value update/insert"
  url: /investments/cron/stocks/splits/
  schedule: everyday 00:15
  timezone: Asia/Tokyo
  target: coincraftservice
  retry_parameters:
    job_retry_limit: 0

#portfolio cron
- description: "update portfolio growth daily"
  url: /investments/cron/portfolio/growth/
  schedule: every 6 hours from 01:00 to 23:59
  timezone: Asia/Tokyo
  target: coincraftservice
  retry_parameters:
    job_retry_limit: 0

- description: "update portfolio holding values"
  url: /investments/cron/holding/value/
  schedule: every 6 hours from 00:30 to 23:59
  timezone: Asia/Tokyo
  target: coincraftservice
  retry_parameters:
    job_retry_limit: 0

#forex cron
- description: "daily forex value update/insert"
  url: /investments/cron/forex/value/
  schedule: every 6 hours from 00:30 to 23:59
  timezone: Asia/Tokyo
  target: coincraftservice
  retry_parameters:
    job_retry_limit: 0

# dividend cron
- description: "refresh dividend tasks"
  url: /investments/cron/dividends/payments/?task=refresh-dividend-payments
  schedule: everyday 01:30
  timezone: Asia/Tokyo
  target: coincraftservice
  retry_parameters:
    job_retry_limit: 0

- description: "refresh dividend income for all portfolios"
  url: /investments/dividends/income/refresh/
  schedule: everyday 05:00
  timezone: Asia/Tokyo
  target: coincraftservice
  retry_parameters:
    job_retry_limit: 0


